version: "3"

vars:
  WPT_MANIFEST: tests/wpt/manifest.yaml
  WPT_RESULTS: tests/wpt/results
  DASHBOARD_COMPOSE: tests/wpt/dashboard/docker-compose.yml
  WPT_JOBS: 4
  GIT_SHA:
    sh: git rev-parse --short HEAD 2>/dev/null || printf working-tree

tasks:
  dashboard:
    desc: Run the local WPT results dashboard at http://localhost:8188
    cmds:
      - docker compose -f {{.DASHBOARD_COMPOSE}} up --build

  latest-results:
    desc: Run the reviewed WPT cases and save a timestamped report
    cmds:
      - zig build
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py {{.WPT_MANIFEST}}
        --mode all --jobs {{.WPT_JOBS}} --browser ./zig-out/bin/zibra
        --report {{.WPT_RESULTS}}/$(date -u +%Y%m%dT%H%M%SZ).json

  wpt:
    desc: Run all allowlisted WPT categories and score skipped suites as failures
    cmds:
      - zig build -Doptimize=ReleaseSafe
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py {{.WPT_MANIFEST}}
        --mode all --full-suite --jobs {{.WPT_JOBS}} --browser ./zig-out/bin/zibra
        --report {{.WPT_RESULTS}}/wpt-$(date -u +%Y%m%dT%H%M%SZ).json

  wpt-smoke:
    desc: Run one upstream testharness, reftest, and crashtest serially
    cmds:
      - zig build -Doptimize=ReleaseSafe
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py tests/wpt/manifest-smoke.yaml
        --mode all --jobs 1 --browser ./zig-out/bin/zibra
        --report {{.WPT_RESULTS}}/smoke-$(date -u +%Y%m%dT%H%M%SZ).json

  wpt-all:
    desc: Run all discovered testharness, reftest, and crashtest cases
    cmds:
      - zig build
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py --all
        --mode all --jobs {{.WPT_JOBS}} --browser ./zig-out/bin/zibra
        --report {{.WPT_RESULTS}}/all-$(date -u +%Y%m%dT%H%M%SZ).json

  wpt-reftest:
    desc: Run discovered WPT reftests through Zibra screenshot comparison
    cmds:
      - zig build
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py --all
        --mode reftest --jobs {{.WPT_JOBS}} --browser ./zig-out/bin/zibra
        --report {{.WPT_RESULTS}}/reftest-$(date -u +%Y%m%dT%H%M%SZ).json

  wpt-crashtest:
    desc: Run discovered WPT crashtests through Zibra's headless lifecycle
    cmds:
      - zig build
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py --all
        --mode crashtest --jobs {{.WPT_JOBS}} --browser ./zig-out/bin/zibra
        --report {{.WPT_RESULTS}}/crashtest-$(date -u +%Y%m%dT%H%M%SZ).json

  dom-results:
    desc: Run focused DOM mutation, traversal, and range WPT cases
    cmds:
      - zig build
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py
        tests/wpt/manifest-dom.yaml --mode testharness --browser ./zig-out/bin/zibra
        --report {{.WPT_RESULTS}}/dom-$(date -u +%Y%m%dT%H%M%SZ).json

  acid3-results:
    desc: Run Acid3's numbered WPT harness and save its granular score
    cmds:
      - zig build
      - mkdir -p {{.WPT_RESULTS}}
      - >-
        ZIBRA_GIT_SHA="{{.GIT_SHA}}" SDL_VIDEODRIVER=dummy python3 tests/wpt/run.py
        tests/wpt/manifest-acid3.yaml --mode testharness --browser ./zig-out/bin/zibra
        --timeout-ms 120000
        --report {{.WPT_RESULTS}}/acid3-$(date -u +%Y%m%dT%H%M%SZ).json
