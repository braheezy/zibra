name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install SDL development libraries
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes libsdl2-dev libsdl2-ttf-dev

      - name: Build
        run: zig build

      - name: Test
        run: zig build test
