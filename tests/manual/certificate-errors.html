   padlock and no proceed-anyway link.
3. Return here once more. This local file URL must not show a padlock.
-->

    <p><a href="https://expired.badssl.com/">Expired certificate</a></p>
    <p><a href="https://self-signed.badssl.com/">Self-signed certificate</a></p>
