  zig build run -- file://$PWD/tests/manual/middle-click.html

a new active tab. Middle-clicking the surrounding text must not open a tab or
change focus. A normal left-click must continue navigating the current tab.
-->

  <body>

    <p><a href="middle-click-target.html">Relative target</a></p>

    <p>This text is not a link.</p>
  </body>
</html>
