<!doctype html>
<!-- How to verify: expect a green PASS after load, a replacement body, and
     the tab title "Document APIs PASS". Click Change title: the tab title
     and heading must change to "Document APIs clicked" without navigation.
     The load-time assertions also run through the local WPT adapter. -->
<html><head><title>Document APIs starting</title>
<style>body { font: 18px sans-serif; margin: 24px; } h1 { color: green; }</style>
</head><body><p>The original body should be replaced.</p>
<script>
window.addEventListener('load', function() {
  var results = [];
  function check(name, run) {
    try { run(); results.push({name: name, status: 0}); }
    catch (e) { results.push({name: name, status: 1, message: String(e)}); }
  }
  function equal(actual, expected) {
    if (actual !== expected) throw Error(String(actual) + ' !== ' + String(expected));
  }
  var oldBody = document.body;
  var replacement = document.createElement('body');
  var heading = replacement.appendChild(document.createElement('h1'));
  heading.textContent = 'Document APIs PASS';
  var button = replacement.appendChild(document.createElement('button'));
  button.textContent = 'Change title';
  button.addEventListener('click', function() {
    document.title = 'Document APIs clicked';
    heading.textContent = document.title;
  });
  check('Replacing the live body updates DOM and synchronous layout', function() {
    document.body = replacement;
    equal(document.body, replacement);
    equal(oldBody.parentNode, null);
    equal(heading.ownerDocument, document);
    equal(heading.getBoundingClientRect().width > 0, true);
  });
  check('Document title changes the actual title element', function() {
    var title = document.head.querySelector('title');
    document.title = '  Document   APIs PASS  ';
    equal(title.text, '  Document   APIs PASS  ');
    equal(document.title, 'Document APIs PASS');
    title.text = document.title;
  });
  check('Detached documents remain independent', function() {
    var detached = document.implementation.createHTMLDocument('Detached');
    detached.title = ' Other   page ';
    equal(detached.title, 'Other page');
    equal(document.title, 'Document APIs PASS');
    detached.removeChild(detached.documentElement);
    equal(detached.documentElement, null);
    equal(detached.head, null);
    equal(detached.body, null);
  });
  var failed = results.filter(function(result) { return result.status !== 0; });
  if (failed.length) {
    heading.style.color = 'red';
    heading.textContent = 'FAIL: ' + failed[0].name + ': ' + failed[0].message;
  }
  if (typeof completion_callback === 'function') completion_callback(results, {status: 0});
});
</script></body></html>
