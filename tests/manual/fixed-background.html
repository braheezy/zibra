<!doctype html>
<!--
How to verify:
1. Load this page at the top: neither panel contains the red 64px tile.
2. Scroll until the first panel reaches the top of the page viewport.
3. Its fixed red tile appears at the same viewport coordinates (80px, 200px),
   clipped by the panel; the second panel's scroll-attached tile stays at its
   80px, 32px offset inside that panel instead.
-->
<style>
  html, body { margin: 0; min-height: 1100px; font: 16px sans-serif; }
  .spacer { height: 300px; }
  .panel {
    width: 220px;
    height: 120px;
    margin: 0 0 40px 40px;
    border: 4px solid #222;
    background-color: #fff8cc;
    background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAFSDNYfAAAAaklEQVR42u3XQQrAIAwAQeP%2F%2F6wf8CJBJTK9lnQ7FpHGaOurt1I34nfH9pMMZAZ8BwMGEvvh%2BBsJCAgICLwIOA8EBAQEBAQEBAQEBK79H5RfIQAAAAAAAAAAAAAAAAAAAAAAAAAAAID%2FABMSqAfj%2FsLmvAAAAABJRU5ErkJggg%3D%3D);
    background-repeat: no-repeat;
    background-position: 80px 32px;
  }
  .fixed {
    background-attachment: fixed;
    background-position: 80px 200px;
  }
  .scroll { background-attachment: scroll; }
</style>

<div class="spacer"></div>
<div id="fixed-target" class="panel fixed">fixed background</div>
<div class="panel scroll">scroll background</div>
