  zig build test-screenshot

How to update the macOS golden after an intentional rendering change:
  zig build run -- --screenshot tests/golden/native-screenshot.macos.png tests/manual/native-screenshot.html

Expected behavior:
  Zibra captures this page through its windowless software-rendering path, and
  the page pixels match tests/golden/native-screenshot.macos.png exactly.
-->

<html>
  <head>
    <title>Native screenshot fixture</title>
    <style>
      body { background-color: white; color: black; }
      div { background-color: #d8f3dc; }
      a { color: #2457e6; }
    </style>
  </head>
  <body>
    <h1>Native screenshot</h1>
    <div class="panel">
      <p>This frame came directly from Zibra's z2d surface.</p>
      <a href="#target">A blue test link</a>
    </div>
  </body>
</html>
