<!--
How to verify:
1. Open this page and wait until both blue fields start with "DONE".
2. The frame field must report 48 samples with an average near the requested
   33ms cadence even though 32 setTimeout callbacks perform CPU work.
3. The timeout field must reach completed=32. Rendering is prioritized, but
   completing every callback proves low-priority work is not starved.
4. With ZIBRA_TRACE=1, task:animation_frame spans should jump ahead of queued
   task:timeout work. Input remains responsive while the page is collecting.
-->
<!doctype html>
<html>
<head>
  <title>priority task scheduler</title>
  <style>
    body { background-color: white; color: black; font-size: 16px; }
    input { width: 720px; height: 26px; }
    #stressArea { width: 720px; filter: blur(4px); }
    .stress { height: 6px; background-color: orange; }
  </style>
</head>
<body>
  <h1>Priority scheduler under timeout load</h1>
  <p>Animation frames: <input id="frameResult" value="collecting 48 frame gaps"></p>
  <p>Timeout progress: <input id="timeoutResult" value="running 32 callbacks"></p>

  <div id="stressArea">
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
    <div class="stress"></div><div class="stress"></div>
  </div>

  <script>
    var timeoutTotal = 32;
    var timeoutCompleted = 0;
    var checksum = 0;
    var timeoutReport = '';
    var frameReport = '';
    var publishRequested = false;

    function publishResults() {
      frameResult.setAttribute('value', frameReport);
      timeoutResult.setAttribute('value', timeoutReport);
    }

    function publishWhenComplete() {
      if (frameReport !== '' && timeoutReport !== '' && !publishRequested) {
        publishRequested = true;
        requestAnimationFrame(publishResults);
      }
    }

    function expensiveTimeout() {
      var value = timeoutCompleted + 1;
      // Keep each task nontrivial but shorter than a frame budget. The queue
      // can prioritize between tasks; it cannot preempt JavaScript mid-task.
      for (var i = 0; i < 3000; i++) {
        value = (value + i * 17) % 65521;
      }
      checksum = (checksum + value) % 65521;
      timeoutCompleted = timeoutCompleted + 1;
      if (timeoutCompleted === timeoutTotal) {
        timeoutReport = 'DONE completed=32 checksum=' + checksum;
        publishWhenComplete();
      }
    }

    function startTimeoutFlood() {
      for (var timeoutIndex = 0; timeoutIndex < timeoutTotal; timeoutIndex++) {
        // A shared future deadline builds one deep queue without charging
        // native helper creation time to the measured frame cadence.
        setTimeout(expensiveTimeout, 250);
      }
    }

    var gaps = [];
    var previous = null;
    var warmupGaps = 4;

    function recordFrame() {
      var current = Date.now();
      if (previous !== null) {
        if (warmupGaps > 0) warmupGaps = warmupGaps - 1;
        else gaps.push(current - previous);
      }
      previous = current;

      if (gaps.length < 48) {
        requestAnimationFrame(recordFrame);
        return;
      }

      var total = 0;
      var minimum = gaps[0];
      var maximum = gaps[0];
      for (var i = 0; i < gaps.length; i++) {
        total = total + gaps[i];
        if (gaps[i] < minimum) minimum = gaps[i];
        if (gaps[i] > maximum) maximum = gaps[i];
      }
      frameReport = 'DONE requested=33ms samples=48 avg=' +
        (total / gaps.length).toFixed(1) + 'ms min=' + minimum +
        'ms max=' + maximum + 'ms';
      publishWhenComplete();
    }

    startTimeoutFlood();
    requestAnimationFrame(recordFrame);
  </script>
</body>
</html>
