<!--
  How to verify:
  1. The blue ordinary block background spans behind the red float, while the
     yellow inline text starts to the float's right and paints above it.
  2. The dark-red negative box is visible only below the ordinary block; its
     overlapping top is behind that block background.
  3. The cyan auto and magenta z=0 boxes overlay normal-flow content, and the
     green positive-z box overlays both. Click each exposed label: the status
     must name the visually topmost box.
-->
<!doctype html>
<html>
  <head>
    <title>Paint-order phases</title>
    <style>
      body {
        margin: 20px;
        background-color: white;
        color: black;
        font-size: 16px;
      }

      .stage {
        position: relative;
        z-index: 0;
        width: 390px;
        height: 190px;
        border: 2px solid #111111;
        background-color: #dddddd;
      }

      .target {
        box-sizing: border-box;
        border: 2px solid #111111;
        cursor: pointer;
      }

      .negative {
        position: absolute;
        z-index: -2;
        left: 22px;
        top: 96px;
        width: 150px;
        height: 76px;
        padding: 8px;
        background-color: #9e2424;
        color: white;
      }

      .float {
        float: left;
        width: 105px;
        height: 76px;
        margin-right: 10px;
        padding: 8px;
        background-color: #ef5959;
      }

      .ordinary {
        height: 92px;
        padding: 8px;
        background-color: #4d82d8;
        color: white;
      }

      .inline-marker {
        color: #fff148;
      }

      .auto {
        position: absolute;
        width: 125px;
        height: 48px;
        padding: 6px;
        color: black;
        left: 145px;
        top: 20px;
        background-color: #4ddde4;
      }

      .zero {
        position: absolute;
        z-index: 0;
        width: 125px;
        height: 48px;
        padding: 6px;
        color: black;
        left: 190px;
        top: 48px;
        background-color: #ed62dd;
      }

      .positive {
        position: absolute;
        z-index: 3;
        width: 125px;
        height: 48px;
        padding: 6px;
        color: black;
        left: 235px;
        top: 76px;
        background-color: #66e36f;
      }

      #status {
        min-height: 24px;
        padding: 6px;
        background-color: #eeeeee;
      }
    </style>
  </head>
  <body>
    <h1>Bounded paint-order phases</h1>
    <p id="status">Click an exposed colored label.</p>
    <div class="stage">
      <div id="negative" class="target negative">negative z=-2</div>
      <div id="float" class="target float">float</div>
      <div id="ordinary" class="target ordinary">
        ordinary block background
        <span id="inline" class="target inline-marker">inline content</span>
      </div>
      <div id="auto" class="target auto">positioned auto</div>
      <div id="zero" class="target zero">positioned z=0</div>
      <div id="positive" class="target positive">positive z=3</div>
    </div>
    <script>
      function report(name) {
        status.innerHTML = 'topmost click: ' + name;
      }

      negative.addEventListener('click', function() { report('negative z=-2'); });
      float.addEventListener('click', function() { report('float'); });
      ordinary.addEventListener('click', function() { report('ordinary block'); });
      inline.addEventListener('click', function(event) {
        event.stopPropagation();
        report('inline content');
      });
      auto.addEventListener('click', function() { report('positioned auto'); });
      zero.addEventListener('click', function() { report('positioned z=0'); });
      positive.addEventListener('click', function() { report('positive z=3'); });
    </script>
  </body>
</html>
