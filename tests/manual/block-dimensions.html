<!doctype html>
<!--
How to verify:
  zig build run -- --dump-style tests/manual/block-dimensions.html
  zig build run -- --dump-layout tests/manual/block-dimensions.html
  zig build run -- tests/manual/block-dimensions.html
Expected: the blue paragraph is 240px wide and wraps; the green paragraph uses
the available width; the orange box is exactly 60px tall and the next block is
positioned after that fixed height; and the purple empty box is 180px by 48px.
-->
<html>
  <head>
    <title>Block dimension regression</title>
  </head>
  <body style="background-color: white; color: black; font-size: 20px">
    <p style="width: 240px; background-color: lightblue">Fixed-width text wraps inside a narrow two-hundred-forty-pixel block instead of using the viewport.</p>
    <p style="width: auto; background-color: lightgreen">Automatic width still fills the available content width.</p>
    <div style="height: 60px; background-color: orange">Fixed height controls this box and the position of its following sibling.</div>
    <div style="width: 180px; height: 48px; background-color: purple"></div>
    <div style="width: 300px; background-color: lightgray">
      <p style="width: auto; background-color: pink">Auto child uses its fixed-width parent.</p>
      <p style="width: 120px; background-color: cyan">Fixed child width.</p>
    </div>
  </body>
</html>
