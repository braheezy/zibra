<!--
How to verify:
1. Run `python3 server.py` and open http://localhost:8005/x-frame-options-demo
   in Zibra. The page must be served by that route, not as a file URL.
2. The DENY frame remains empty; its protected response must not be installed.
3. The SAMEORIGIN frame displays a green panel saying that it is visible.
4. Open /x-frame-options?policy=deny as a top-level page. It remains visible,
   because X-Frame-Options restricts embedding rather than direct navigation.
-->
<!doctype html>
<style>
  body { font-family: sans-serif; }
  iframe { display: block; width: 520px; height: 110px; margin: 8px 0 20px; }
  .allowed { background-color: #b7f5bd; }
</style>
<h1>X-Frame-Options</h1>
<h2>DENY (must stay empty)</h2>
<iframe src="/x-frame-options?policy=deny"></iframe>
<h2>SAMEORIGIN (must render)</h2>
<iframe class=allowed src="/x-frame-options?policy=sameorigin"></iframe>
