<!-- How to verify: the differently colored side borders meet along diagonal
     miter joins with no rectangular corner overlap. The zero-content shape
     below is made entirely from border triangles. -->
<!doctype html>
<style>
  html, body { margin: 0; padding: 0; }
  body { padding: 32px; font: 16px sans-serif; }

  .asymmetric {
    width: 180px;
    height: 64px;
    margin-bottom: 32px;
    border-style: solid;
    border-width: 8px 20px 16px 12px;
    border-color: #cc0000 #008800 #0000cc #aa8800;
    background: #eeeeee;
  }

  .diamond {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 28px 42px;
    border-color: #cc0000 #008800 #0000cc #aa8800;
  }
</style>
<div class="asymmetric">Asymmetric mitered border</div>
<div class="diamond"></div>
