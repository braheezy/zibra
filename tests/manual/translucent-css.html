<!doctype html>
<!-- How to verify: Open in Zibra. Three pale-red cards must paint immediately,
     including rounded borders and a translated card, without raster errors.
     The inner square is brighter because it has a second translucent layer. -->
<title>Translucent CSS paint</title>
<style>
  body { font:16px sans-serif; background:white; padding:24px; }
  .card { width:200px; height:120px; padding:20px; margin:20px;
    background:rgba(255,0,0,.2); border:4px solid rgba(255,0,0,.5); }
  .rounded { border-radius:20px; }
  .translated { transform:translate(40px,0); }
  .square { width:40px; height:40px; background:rgba(255,0,0,.25); }
</style>
<h1>Translucent CSS must not stop painting</h1>
<div class=card>Plain card<div class=square></div></div>
<div class="card rounded">Rounded card<div class=square></div></div>
<div class="card translated">Translated card<div class=square></div></div>
