# Bounded source-to-style baselines for the experimental Terence integration.
# The WPT harness, screenshot and crash adapters still use the production
# frontend: their results are NOT Terence compatibility results. Inspection
# parity/recovery goldens and owner tests exercise Terence independently.
# Leave upstream PASS expectations unchanged, including EOF recovery failures.
tests:
  # Computed custom values and !important trimming; no stylesheet CSSOM needed.
  - css/css-syntax/declarations-trim-whitespace.html
reftests:
  # Complete ordinary declarations and escaped names establish parity.
  - css/css-syntax/missing-semicolon.html
  - css/CSS2/syntax/escaped-ident-char-001.xht
  # Ordinary and nested @media EOF recovery motivate the frontend migration.
  - css/CSS2/syntax/eof-001.xht
  - css/CSS2/syntax/eof-004.xht
crashtests:
  # Static nested at-rule syntax; no stylesheet mutation API prerequisite.
  - css/css-syntax/crashtests/atrule-with-escape-character.html
