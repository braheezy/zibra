<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wpt.fyi — Zibra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/">wpt<span>.zibra</span></a>
      <p class="side-intro">Web Platform Tests results for the Zibra browser engine.</p>
      <label class="run-picker" for="run-select">Run <select id="run-select"><option value="">No reports</option></select></label>
      <button id="refresh" class="refresh" type="button">↻ Refresh</button>
    </header>

    <main class="main-content">
      <section class="chart-panel">
        <div class="chart-copy"><strong>Overall suite history</strong><span>Full-suite runs only</span></div>
        <div class="chart-legend"><span><i></i> zibra</span></div>
        <svg id="history-chart" role="img" aria-label="Zibra overall suite pass-rate history" viewBox="0 0 900 300" preserveAspectRatio="none">
          <g class="grid-lines"><line x1="55" y1="25" x2="875" y2="25"></line><line x1="55" y1="85" x2="875" y2="85"></line><line x1="55" y1="145" x2="875" y2="145"></line><line x1="55" y1="205" x2="875" y2="205"></line><line x1="55" y1="265" x2="875" y2="265"></line></g>
          <g class="axis-labels"><text x="16" y="29">100%</text><text x="28" y="149">50%</text><text x="36" y="269">0%</text><text x="465" y="295">Date</text></g>
          <polyline id="history-line" points=""></polyline><g id="history-points"></g><g id="history-dates"></g>
        </svg>
        <p id="chart-empty" class="chart-empty">No full-suite history yet.</p>
      </section>

      <section class="results-summary">
        <span class="summary-copy"><strong id="results-score">—</strong><span id="results-description">No results selected.</span></span>
        <span class="summary-links"><a href="https://github.com/braheezy/zibra" target="_blank" rel="noreferrer">SOURCE</a></span>
      </section>

      <section class="results-panel">
        <div class="results-toolbar"><label class="search"><span class="visually-hidden">Search paths</span><input id="path-search" type="search" placeholder="Search paths" autocomplete="off"></label><label class="sort">Sort <select id="directory-sort"><option value="pass-desc">Pass percentage ↓</option><option value="pass-asc">Pass percentage ↑</option><option value="path">Path</option></select></label><span id="health" class="health" aria-live="polite">Loading…</span></div>
        <div class="table-wrap"><table class="results-table"><thead><tr><th scope="col">Path</th><th id="browser-column" scope="col">Zibra</th></tr></thead><tbody id="coverage-table"><tr><td colspan="2" class="empty">No reports yet.</td></tr></tbody></table></div>
      </section>

    </main>
  </div>
  <footer>Local WPT results · <code>tests/wpt/results</code> · nothing is uploaded</footer>
  <script src="app.js"></script>
</body>
</html>
