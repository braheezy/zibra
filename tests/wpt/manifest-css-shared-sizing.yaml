# Shared horizontal sizing and flex/grid alignment. All cases are already
# enabled by manifest.yaml's css directory; expectations remain upstream PASS.
# Mixed writing-mode cases stay intact and expose the remaining vertical-axis
# limitation. Grid CSSOM/FontFaceSet prerequisites are recorded separately from
# layout failures when their helpers cannot reach geometry assertions.
