# Convention: directories expand to testharness, reftest, and crashtest cases.
# Individual paths go under tests, reftests, or crashtests respectively.
# Probes are separate opt-in fetch/parse smoke tests, excluded by --mode all.
# Omit deviations when PASS is expected.
#
# These are the WPT areas for which Zibra has at least a meaningful initial
# implementation. `task wpt` runs these directories; the full-suite report
# still scores every discovered WPT directory, so unsupported areas remain
# visible as 0/N instead of disappearing.
directories:
  - console
  - dom
  - domparsing
  - focus
  - selection
  - uievents
