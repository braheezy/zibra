# Convention: directories expand to testharness, reftest, and crashtest cases.
# Individual paths go under tests, reftests, or crashtests respectively.
# Probes are separate opt-in fetch/parse smoke tests, excluded by --mode all.
# Omit deviations when PASS is expected.
#
# These are the WPT areas for which Zibra has at least a meaningful initial
# implementation. `task wpt` runs these directories; the full-suite report
# still scores every discovered WPT directory, so unsupported areas remain
# visible as 0/N instead of disappearing.
directories:
  - console
  - dom
  - domparsing
  - focus
  - selection
  - uievents
tests:
  - dom/nodes/Element-firstElementChild.html
  # Element rectangles and box metrics; do not opt into all of CSSOM View yet.
  - css/cssom-view/cssom-getBoundingClientRect-001.html
  - css/cssom-view/cssom-getBoundingClientRect-002.html
  - css/cssom-view/cssom-getClientRects.html
  - css/cssom-view/cssom-getClientRects-002.html
  - css/cssom-view/GetBoundingRect.html
  - css/cssom-view/htmlelement-offset-width-001.html
  - css/cssom-view/ttwf-js-cssomview-getclientrects-length.html
  - css/cssom-view/offsetParent-body-and-html.html
  - css/cssom-view/offsetTopLeftInScrollableParent.html
  - css/cssom-view/client-props-zoom.html
reftests:
  - css/CSS2/backgrounds/background-color-174.xht
crashtests:
  - css/css-flexbox/flex-shrink-large-value-crash.html
probes:
  - html/semantics/text-level-semantics/the-b-element/b-usage.html

# Only list a path here when its expected result differs from PASS.
# deviations:
#   dom/example-known-failure.html: fail
