# Numeric grid lines/spans, implicit tracks, and row/column sparse/dense flow.
# Whole unchanged upstream files; all expectations remain PASS. The default
# manifest already selects CSS across testharness, reftest, and crashtest.
# Mixed grammar files retain unsupported named lines and integer math (including
# sibling-index/container units); those assertions are not geometry coverage.
# Neighboring sparse/dynamic placement harnesses depend on document.fonts.ready;
# named areas, vertical writing, subgrid, and Ahem-dependent comparisons are
# separate prerequisites and are not selected for this bounded iteration.
