<!doctype html>
<style>
  html, body {
    display: block;
    margin: 0;
    padding: 0;
  }

  .stage {
    display: block;
    position: relative;
    z-index: 0;
    width: 120px;
    height: 48px;
  }

  .negative {
    display: block;
    position: absolute;
    z-index: -2;
    left: 0;
    top: 0;
    width: 120px;
    height: 20px;
    background-color: #800000;
  }

  .float {
    display: block;
    float: left;
    width: 40px;
    height: 24px;
    background-color: #ff0000;
  }

  .static {
    display: block;
    margin: 0;
    padding: 0;
    height: 24px;
    background-color: #0000ff;
  }

  .marker {
    display: list-item;
    height: 24px;
    color: #ffff00;
  }

  .auto {
    display: block;
    position: absolute;
    left: 48px;
    top: 4px;
    width: 32px;
    height: 20px;
    background-color: #00ffff;
  }

  .zero {
    display: block;
    position: absolute;
    z-index: 0;
    left: 60px;
    top: 8px;
    width: 32px;
    height: 20px;
    background-color: #ff00ff;
  }

  .positive {
    display: block;
    position: absolute;
    z-index: 3;
    left: 72px;
    top: 12px;
    width: 32px;
    height: 20px;
    background-color: #00ff00;
  }
</style>

<!-- The direct stage children exercise all bounded stacking phases. The
     ordinary list block's blue background must paint below the sibling float,
     while its yellow list marker is inline/content paint and therefore follows it. -->
<div class="stage"><div class="negative"></div><div class="float"></div><ul class="static"><li class="marker"></li></ul><div class="auto"></div><div class="zero"></div><div class="positive"></div></div>
