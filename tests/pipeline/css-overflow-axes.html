<!doctype html>
<html><head><style>
html,body { margin:0; padding:0 }
main { display:block; width:500px; font-size:0; line-height:0 }
.row { display:flex; gap:100px; height:140px }
.box { flex:none; width:80px; height:60px; border:4px solid #334155; background:#fef3c7 }
.fill { width:160px; height:120px; background:#15803d }
#x { overflow:clip visible }
#y { overflow:visible clip }
#both { overflow:hidden clip; padding:10px; border-radius:12px }
#outer { width:100px; height:80px; overflow:auto; background:#dcfce7 }
#inner { width:40px; height:30px; overflow:clip visible }
#nested { width:200px; height:120px; background:#86efac }
</style></head><body><main><div class="row"><div id="x" class="box"><div class="fill"></div></div><div id="y" class="box"><div class="fill"></div></div></div><div id="both" class="box"><div class="fill"></div></div><div id="outer"><div id="inner"><div id="nested"></div></div></div></main></body></html>
